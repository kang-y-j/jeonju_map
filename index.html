<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>전주시 버스정류장 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      #map {
        height: 100vh;
        width: 100%;
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
      const map = L.map("map").setView([35.8242, 127.148], 13); // 전주 중심

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(
        map,
      );

      fetch("/api/bus-stops")
        .then((res) => res.json())
        .then((data) => {
          data.forEach((stop) => {
            L.marker([stop.위도, stop.경도])
              .addTo(map)
              .bindPopup(`🚌 ${stop.정류장명}`);
          });
        });
    </script>
  </body>
</html>
